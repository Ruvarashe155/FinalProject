{% extends "base.html" %}

{% block content %}

<style>

.page-title {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 5px;
}

.page-subtitle {
    font-size: 14px;
    color: #6b7280;
    margin-bottom: 20px;
}


.card-box {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.05);
    margin-bottom: 20px;
}


.summary-box {
    background: #f8fafc;
    border-left: 4px solid #22c55e;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
}

.summary-box h4 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
}

.summary-box p {
    margin: 5px 0 0;
    color: #64748b;
    font-size: 14px;
}

.form-label {
    font-size: 13px;
    font-weight: 500;
    color: #475569;
}

.form-control,
.form-select {
    border-radius: 8px;
    font-size: 14px;
}

textarea.form-control {
    resize: none;
}

.btn {
    border-radius: 8px;
}


.btn-success {
    padding: 10px 16px;
    font-weight: 500;
}
</style>


<div>
    <div class="page-title">Disburse Expense</div>
    <div class="page-subtitle">Process payment for approved expense</div>
</div>


<div class="summary-box">
    <h4>{{ expense.name }}</h4>
    <p>Total Amount: <strong>${{ expense.total_amount }}</strong></p>
</div>


<div class="card-box">

    <form method="POST" class="needs-validation" novalidate>
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Payment Method</label>
            <select name="payment_method" id="payment_method"
                    class="form-select" required>
                <option value="" disabled selected>Select a method</option>
                <option value="Cash">Cash</option>
                <option value="Bank Transfer">Bank Transfer</option>
                <option value="Mobile Money">Mobile Money</option>
                <option value="Cheque">Cheque</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Reference Number (optional)</label>
            <input type="text" name="reference_number"
                   id="reference_number_id"
                   class="form-control"
                   placeholder="Enter reference number">
        </div>

        <div class="mb-3">
            <label class="form-label">Additional Notes</label>
            <textarea name="notes" id="notes_id"
                      class="form-control"
                      rows="3"
                      placeholder="Optional notes..."></textarea>
        </div>

        <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-success">
                Complete Disbursement
            </button>
        </div>

    </form>

</div>

{% endblock %}
