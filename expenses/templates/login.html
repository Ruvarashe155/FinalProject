{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Login{% endblock %}</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;

    background:
        linear-gradient(
            135deg,
            rgba(30,60,114,0.95),
            rgba(42,82,152,0.92)
        );
}


.background-shape{
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
    opacity:0.35;
    animation:float 8s ease-in-out infinite;
}

.shape-1{
    width:300px;
    height:300px;
    background:#60a5fa;
    top:-80px;
    left:-80px;
}

.shape-2{
    width:250px;
    height:250px;
    background:#818cf8;
    bottom:-70px;
    right:-70px;
    animation-delay:2s;
}

.shape-3{
    width:180px;
    height:180px;
    background:#38bdf8;
    bottom:120px;
    left:120px;
    animation-delay:4s;
}

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-20px);
    }

    100%{
        transform:translateY(0px);
    }

}


.auth-container{
    position:relative;
    z-index:10;
    width:100%;
    max-width:700px;
    padding:20px;
}


.auth-card{
    background:rgba(255,255,255,0.95);
    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.3);

    border-radius:32px;

    padding:55px 50px;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.18),
        0 4px 12px rgba(255,255,255,0.08) inset;

    transition:0.35s ease;
}



.auth-card:hover{
    transform:translateY(-4px);
}


.logo-wrapper{
    width:110px;
    height:110px;

    margin:0 auto 18px;

    background:#fff;

    border-radius:24px;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:0 8px 24px rgba(0,0,0,0.08);
}

.logo{
    width:82px;
    height:82px;
    object-fit:contain;
}


.auth-title{
    font-size:30px;
    font-weight:700;
    color:#111827;
    margin-bottom:6px;
}

.auth-subtitle{
    color:#6b7280;
    font-size:14px;
    margin-bottom:30px;
}


.form-label{
    font-size:13px;
    font-weight:600;
    color:#374151;
    margin-bottom:6px;
}


.input-group{
    border-radius:14px;
    overflow:hidden;
    border:1px solid #dbe3ee;
    transition:0.25s ease;
    background:#fff;
}

.input-group:focus-within{
    border-color:#2563eb;
    box-shadow:0 0 0 4px rgba(37,99,235,0.12);
}


.input-group-text{
    border:none;
    background:#fff;
    color:#6b7280;
    padding-left:14px;
}


.form-control{
    border:none !important;
    box-shadow:none !important;
    font-size:14px;
    padding:14px 12px;
}


.form-control::placeholder{
    color:#9ca3af;
}


.btn-login{
    width:100%;
    border:none;

    padding:14px;

    border-radius:14px;

    font-size:15px;
    font-weight:600;

    color:#fff;

    background:linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );

    transition:0.3s ease;

    margin-top:10px;
}

.btn-login:hover{
    transform:translateY(-2px);

    box-shadow:
        0 12px 24px rgba(37,99,235,0.25);
}


.error-message{
    margin-top:18px;

    background:#fee2e2;
    color:#991b1b;

    padding:12px;
    border-radius:12px;

    font-size:13px;
    font-weight:500;
}


.extra-links{
    margin-top:20px;
}

.extra-links a{
    text-decoration:none;
    color:#2563eb;
    font-size:13px;
    font-weight:500;
    transition:0.2s ease;
}

.extra-links a:hover{
    color:#1d4ed8;
}


.footer-text{
    margin-top:24px;
    font-size:12px;
    color:#9ca3af;
}


@media(max-width:576px){

    .auth-card{
        padding:32px 24px;
        border-radius:22px;
    }

    .auth-title{
        font-size:26px;
    }

}

</style>

</head>

<body>

    
    <div class="background-shape shape-1"></div>
    <div class="background-shape shape-2"></div>
    <div class="background-shape shape-3"></div>


    <div class="auth-container">

        <div class="auth-card text-center">

            
            <div class="logo-wrapper">

                <img src="{% static 'images/gzulogo.jpg' %}"
                     class="logo"
                     alt="GZU Logo">

            </div>

            
            <div class="auth-title">
                GZU EMS
            </div>

            <div class="auth-subtitle">
                Expense Management System
            </div>


            
            <form action="{% url 'expenses:login' %}" method="post">

                {% csrf_token %}

                
                <div class="mb-3 text-start">

                    <label class="form-label">
                        Username
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-person"></i>
                        </span>

                        <input type="text"
                               name="username"
                               class="form-control"
                               placeholder="Enter username"
                               required>

                    </div>

                </div>


                
                <div class="mb-3 text-start">

                    <label class="form-label">
                        Password
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>

                        <input type="password"
                               name="password"
                               class="form-control"
                               placeholder="Enter password"
                               required>

                    </div>

                </div>


                
                <button type="submit" class="btn-login">
                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    Sign In
                </button>

            </form>


            
            {% if form.errors %}

                <div class="error-message">
                    Invalid username or password
                </div>

            {% endif %}


            
            <div class="extra-links">

                <a href="{% url 'expenses:password_reset' %}">
                    Forgot Password?
                </a>

            </div>


            
            <div class="footer-text">
                Great Zimbabwe University © 2026
            </div>

        </div>

    </div>

</body>

</html>
